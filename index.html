<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css" />
  <!-- BootStrap -->
  <link href="css/bootstrap/style.css" rel="stylesheet" />
  <!-- JavaScript -->
  <script src="js/script.js" defer></script>
  <title>Home - Cadastrar despesa</title>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-5">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="img/logo.png" width="50" height="35" alt="Orçamento pessoal" />
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ms-auto justify-content-center">
          <li class="nav-item">
            <a class="nav-link active" href="index.html">Cadastro</a>
          </li>
          <li class="nav-item ms-4">
            <a class="nav-link" href="consulta.html">Consulta</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="row">
      <div class="col mb-5">
        <h1 class="display-4">Registro de nova despesa</h1>
      </div>
    </div>
    <form onsubmit="event.preventDefault(); cadastrarDespesa();">
      <div class="row mb-3 g-3 g-md-4">
        <div class="col-md-2">
          <select class="form-control" id="ano">
            <option value="">Ano</option>
          </select>
        </div>

        <div class="col-md-2">
          <select class="form-control" id="mes">
            <option value="">Mês</option>
            <option value="01">Janeiro</option>
            <option value="02">Fevereiro</option>
            <option value="03">Março</option>
            <option value="04">Abril</option>
            <option value="05">Maio</option>
            <option value="06">Junho</option>
            <option value="07">Julho</option>
            <option value="08">Agosto</option>
            <option value="09">Setembro</option>
            <option value="10">Outubro</option>
            <option value="11">Novembro</option>
            <option value="12">Dezembro</option>
          </select>
        </div>

        <div class="col-md-2">
          <input type="text" class="form-control" placeholder="Dia" id="dia" inputmode="numeric" required />
        </div>

        <div class="col-md-6">
          <select class="form-control" id="tipo">
            <option value="">Tipo</option>
            <option value="1">Alimentação</option>
            <option value="2">Educação</option>
            <option value="3">Lazer</option>
            <option value="4">Saúde</option>
            <option value="5">Transporte</option>
          </select>
        </div>
      </div>

      <div class="row g-3 g-md-4">
        <div class="col-md-7">
          <input type="text" class="form-control" placeholder="Descrição" id="descricao" />
        </div>

        <div class="col-md-3">
          <div class="input-group">
            <span class="input-group-text">R$</span>
            <input type="text" class="form-control" placeholder="0,00" id="valor" inputmode="decimal" />
          </div>
        </div>

        <div class="col-md-2 d-flex justify-content-end">
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-plus me-1 d-md-none d-lg-inline-block"></i>
            Adicionar
          </button>
        </div>
      </div>
    </form>
    <div class="row mt-5 pt-3">
      <div class="col">
        <h2 class="mb-4">Despesas recentes</h2>
        <p class="text-muted mb-3">Últimas 5 despesas cadastradas</p>

        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>Data</th>
                <th>Tipo</th>
                <th>Descrição</th>
                <th>Valor</th>
              </tr>
            </thead>

            <tbody id="listaDespesasRecentes"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="modalRegistraDespesa" tabindex="-1" aria-labelledby="titleModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 id="titleModal"></h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="bodyModal"></div>
        <div class="modal-footer">
          <button type="button" id="btnModal" data-bs-dismiss="modal"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- BootStrap -->
  <script src="libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/90b19570b9.js" crossorigin="anonymous"></script>
</body>

</html>
