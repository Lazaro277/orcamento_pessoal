<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- BootStrap -->
  <link href="css/bootstrap/style.css" rel="stylesheet" />
  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css" />
  <!-- JavaScript -->
  <script src="js/script.js" defer></script>
  <title>Consultar despesa</title>
</head>

<body>

  <nav class="navbar navbar-expand-sm navbar-dark bg-primary mb-5">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="img/logo.png" width="50" height="35" alt="Orçamento pessoal" />
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ms-auto justify-content-center">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Cadastro</a>
          </li>
          <li class="nav-item ms-4">
            <a class="nav-link active" href="consulta.html">Consulta</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="row mb-5">
      <div class="col">
        <h1 class="display-4">Consulta de despesas</h1>
      </div>
    </div>

    <p class="text-muted mb-3 fs-5 fw-semibold">Filtrar despesas</p>
    <div class="row mb-3 g-3 g-md-4">
      <div class="col-md-2">
        <select class="form-control" id="ano">
          <option value="">Ano</option>
        </select>
      </div>

      <div class="col-md-2">
        <select class="form-control" id="mes">
          <option value="">Mês</option>
          <option value="01">Janeiro</option>
          <option value="02">Fevereiro</option>
          <option value="03">Março</option>
          <option value="04">Abril</option>
          <option value="05">Maio</option>
          <option value="06">Junho</option>
          <option value="07">Julho</option>
          <option value="08">Agosto</option>
          <option value="09">Setembro</option>
          <option value="10">Outubro</option>
          <option value="11">Novembro</option>
          <option value="12">Dezembro</option>
        </select>
      </div>

      <div class="col-md-2">
        <input type="text" class="form-control" placeholder="Dia" id="dia" inputmode="numeric" autocomplete="off" />
      </div>

      <div class="col-md-6">
        <select class="form-control" id="tipo">
          <option value="">Tipo</option>
          <option value="1">Alimentação</option>
          <option value="2">Educação</option>
          <option value="3">Lazer</option>
          <option value="4">Saúde</option>
          <option value="5">Transporte</option>
        </select>
      </div>
    </div>

    <div class="row g-3 g-md-4">
      <div class="col-md-8">
        <input type="text" class="form-control" placeholder="Descrição" id="descricao" autocomplete="off" />
      </div>

      <div class="col-md-2">
        <input type="text" class="form-control" placeholder="Valor" id="valor" autocomplete="off" />
      </div>

      <div class="col-md-2 d-flex justify-content-end">
        <button type="button" class="btn btn-primary" onclick="pesquisarDespesas()" aria-label="Pesquisar despesas">
          <i class="fas fa-search"></i>
        </button>
      </div>
    </div>

    <div class="row mt-2 mt-md-5 pt-2">
      <div class="col">
        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th>Data</th>
                <th>Tipo</th>
                <th>Descrição</th>
                <th>Valor</th>
                <th></th>
              </tr>
            </thead>

            <tbody id="listaDespesas"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="modalRegistraDespesa" tabindex="-1" aria-labelledby="titleModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 id="titleModal"></h1>
          <button type="button" class="btn-close" id="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="bodyModal"></div>
        <div class="modal-footer">
          <button type="button" id="btnModal" data-bs-dismiss="modal"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- BootStrap -->
  <script src="libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/90b19570b9.js" crossorigin="anonymous"></script>
</body>

</html>
